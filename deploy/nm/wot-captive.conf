# Wall of Text captive portal (BUILD_PLAN 5.3). Read only by NetworkManager's
# shared-mode dnsmasq, i.e. only while the WallOfText-Setup AP is up.
# Every name resolves to the Pi so phones' connectivity probes reach us.
address=/#/10.42.0.1
# RFC 8910 captive-portal API hint (DHCP option 114) for newer phones.
dhcp-option-force=114,http://10.42.0.1/setup
