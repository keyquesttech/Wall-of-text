<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121315">
<title>Sign in · Wall Printer</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/ui/setup.css">
</head>
<body>
<main>
  <div class="brand"><span class="slotmark" aria-hidden="true"></span>Wall Printer</div>
  <h1>Sign in</h1>
  <p class="dim">Enter the printer's password to continue.</p>
  <div id="msg"></div>
  <form id="form" novalidate>
    <label for="pw">Password</label>
    <div class="field">
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required autofocus>
      <button type="button" class="show" aria-pressed="false">Show</button>
    </div>
    <label class="check"><input id="remember" type="checkbox" checked> Remember this device for 30 days</label>
    <button class="btn-green block" id="go" type="submit">Sign in</button>
  </form>
  <p class="dim" style="margin-top:22px;font-size:14px">Forgot it? Someone with access to the Pi can run <span class="mono">sudo walloftext-reset-password</span>, which puts back the default password.</p>
</main>
<script src="/ui/common.js"></script>
<script>
(function () {
  var form = WOT.$("#form"), go = WOT.$("#go"), msg = WOT.$("#msg");
  WOT.showHide();
  function nextUrl() {
    var m = /[?&]next=([^&]+)/.exec(location.search);
    var n = m ? decodeURIComponent(m[1]) : "/";
    return n.charAt(0) === "/" && n.charAt(1) !== "/" ? n : "/";
  }
  WOT.api("GET", "/api/auth/status").then(function (r) {
    if (r.ok && r.data.signed_in) location.replace(nextUrl());
  });
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pw = WOT.$("#pw").value;
    if (!pw) { WOT.banner(msg, "Type the password first."); return; }
    go.disabled = true;
    WOT.api("POST", "/api/auth/login", { password: pw, remember: WOT.$("#remember").checked }).then(function (r) {
      go.disabled = false;
      if (r.ok) { location.replace(nextUrl()); return; }
      WOT.banner(msg, r.data.message || "Couldn't sign in. Try again.");
      WOT.$("#pw").select();
    }, function () {
      go.disabled = false;
      WOT.banner(msg, "Can't reach the printer. Check you're on the same Wi-Fi.");
    });
  });
})();
</script>
</body>
</html>
