[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walloftext"
version = "0.1.0"
description = "Wall of Text: a thermal wall printer on a Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pillow>=10",
  "numpy>=1.26",
  "segno>=1.6",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "sse-starlette>=2",
  "python-multipart>=0.0.9",
  "fonttools>=4.40",
  "icalendar>=5",
  "recurring-ical-events>=2.1",
  "imap-tools>=1.5",
]

[project.optional-dependencies]
pi = ["gpiozero>=2", "lgpio>=0.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "playwright>=1.40", "cairosvg>=2.7"]

[project.scripts]
walloftext = "walloftext.app:main"

[tool.setuptools.packages.find]
include = ["walloftext*"]

[tool.setuptools.package-data]
# non-Python files the app reads at run time must ship in the installed package
walloftext = ["sources/*.json", "assets/wx/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
