<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./wp.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Silkscreen&amp;family=Space+Mono:wght@400;700&amp;family=VT323&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav class="wp glass tabs" aria-label="Main" style="width: 358px; height: 72px; background-color: rgba(30,31,36,.55); font-family: Inter, sans-serif; color: #C9CDD4">
<a href="Main.dc.html" class="{{c.create}}" aria-label="Create">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.9L12 16.5l-1.8-4.9L5 9.7l5.2-1.8z"></path><path d="M19 15v4M17 17h4"></path></svg>
<span>Create</span>
</a>
<a href="Schedules.dc.html" class="{{c.schedules}}" aria-label="Schedules">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
<span>Schedules</span>
</a>
<a href="History.dc.html" class="{{c.history}}" aria-label="History">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5L6 21z"></path><path d="M9 8h6M9 12h6M9 16h3"></path></svg>
<span>History</span>
<sc-if value="{{hasBadge}}" hint-placeholder-val="{{ false }}"><span class="badge">{{badge}}</span></sc-if>
</a>
<a href="Settings.dc.html" class="{{c.settings}}" aria-label="Settings">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>
<span>Settings</span>
</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["create","schedules","history","settings"],"default":"create"},"badge":{"editor":"int","default":0},"$preview":{"width":358,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'create';
    const c = {};
    ['create','schedules','history','settings'].forEach((k) => { c[k] = k === a ? 'tab act' : 'tab'; });
    const b = Number(this.props.badge || 0);
    return { c, badge: b, hasBadge: b > 0 };
  }
}
</script>
</body>
</html>
